<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="num1" id="firstNumber" placeholder="Enter first number"> <br>
    <input type="text" name="num2" id="secondNumber" placeholder="Enter second number"> <br>
    <input type="button" name="submit" value="Submit" onclick="numSum();">

    <!-- Empty div to display result -->
     <div id="displayResult"></div> 

     <script>
        //create sum procedure or function
        function numSum(){ 
           var num1 = parseInt(document.getElementById("firstNumber").value);
           var num2 = parseInt(document.getElementById("secondNumber").value);

           //convert string to integer
            /*   num1 = parseInt(num1);
              num2 = parseInt(num2); */
           var sum = num1 + num2;
            document.getElementById("displayResult").innerHTML = `The Sum of the two numbers entered by the user is: ${sum}`;
        }
       
     </script>
</body>
</html>
